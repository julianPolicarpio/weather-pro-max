# Copy to config/kmia.yaml and fill in secrets locally. config/kmia.yaml is git-ignored.
# THE ORDER BOT IS OFF (2026-08-02, Julian's call: focus on the paper demo
# account). This is the OUTERMOST of three independent switches -- arming still
# needs the HIGHCAST_TRADING literal AND an unexpired HIGHCAST_TRADING_UNTIL.
# With this false the bot is never invoked, so it cannot be armed by accident.
#
# Cost of switching it off: `bot_orders` stops accruing. Acceptable because
# `signals` (~250 rows/day, all four markets) and `app_bets` keep accruing from
# the same wake cycle and carry strictly more information -- the demo account
# replays those. Set back to true if the bot's own decision log is ever needed.
orderbot_enabled: false

station:
  key: kmia
  name: Miami Intl Airport
  icao: KMIA
  iem_id: MIA
  iem_network: FL_ASOS
  wfo: MFL
  lat: 25.7906
  lon: -80.3164
  tz: America/New_York
  # EASTERN STANDARD TIME, not EDT. The climate day is midnight-to-midnight in
  # LOCAL STANDARD time year-round (DST-invariant), which for KMIA is 05:00Z ->
  # 05:00Z. KLAX's is 08:00Z -> 08:00Z. Getting this wrong silently buckets
  # observations into the neighbouring climate day.
  std_utc_offset: -5
  # From api.weather.gov/points/25.7906,-80.3164 -- WFO MFL, forecast and fire
  # zone are both FLZ074. Fetched, not guessed: KLAX needed two zones because of
  # a 2023 renumbering, so the zone list is never assumed.
  nws_zones: ["FLZ074"]
  # Kalshi daily Miami high-temp market (kalshi.com/markets/kxhighmia). Resolves
  # on the NWS Daily Climate Report for Miami, FL -- the SAME source as KLAX,
  # confirmed from the MIAHIGH contract rules, so the architecture transfers.
  kalshi_series: KXHIGHMIA
  # Kalshi daily Miami low-temp market.
  kalshi_low_series: KXLOWTMIA
display_tz: Asia/Manila
synoptic_token: ""
# KMIA'S OWN WEBHOOK, deliberately NOT the KLAX one. Every alert also carries
# its station in the title, so a shared channel would be correct -- but the two
# stations' schedules collide (KMIA's LOW commits at the same 17:00 Manila as
# KLAX's LOW preview), and during a head-to-head test week the point is to be
# able to read one city's record without the other interleaved.
discord_webhook_url: ""
db_path: data/highcast.db
staking:
  # Mirrors config/klax.yaml. NOT tuned for Miami -- these are placeholders until
  # KMIA has its own measured hour curve. See HANDOFF: the decision hours and
  # cutoffs below are LAX numbers and must not be read as measured for Miami.
  bankroll: 0.0
  min_edge: 0.03           # >=3 percentage-points calibrated-model-vs-market edge.
                           # LOWERED FROM 0.05 on 2026-07-31, deliberately, to
                           # take accurate-but-small edges. The floor is the FEE,
                           # not a preference: at 1 contract Kalshi's fee rounds
                           # up to 2c at every price, so a 2-point edge nets
                           # exactly zero and anything under it loses. 3 points
                           # is the smallest edge that actually pays.
                           # Measured context: the app's big-edge bets went
                           # 2W-4L while its no-edge skips went 6W-0L, so a WIDE
                           # gap to the market is a warning, not an opportunity.
  personal_cutoff: "09:00"
  low_personal_cutoff: "04:00"
model:
  # TRAINING-HOUR BANDWIDTH = 1 (train on {h-1, h, h+1}), measured on KMIA
  # 2026-07-29 with `scripts/bandwidth_eval.py`. For the HIGH this dominates the
  # old k=0 on all three axes at once -- MAE 1.070 -> 1.052, bucket hit
  # 55.1% -> 55.7%, churn 1.81 -> 1.73 distinct buckets/day -- which is the only
  # unambiguous, trade-off-free improvement found in this whole investigation.
  # The LOW gains accuracy only (dMAE -0.014, dHIT +0.2 pts, churn flat).
  #
  # KLAX deliberately stays at the default k=0: it is mid-test-week and frozen,
  # and moving its model would void the scorecard it is running.
  intraday_hour_bandwidth: 1
  late_commit_guard: true

# DEAD MAN'S SWITCH. URL of a hosted check that alerts when pings STOP arriving.
#
# WHY IT CANNOT BE A LOCAL ALERT: on 2026-08-08/09 a power cut took the laptop
# down 11.6h then 9.6h and cost four commits. The missed-commit Discord alert
# cannot cover that -- the outage that stops the wake cycle stops the alert too.
# Nothing running on this machine can report that this machine is off.
#
# SETUP (the one step the code cannot do): create a check on any dead-man's
# switch service that accepts an HTTP ping, set period ~10 min and grace ~20
# (the wake cycle runs every 5), point its notification at the same Discord
# channel the bet alerts use, and paste the ping URL below. BOTH stations need
# it -- one check per station, or a healthy KLAX ping masks a dead KMIA.
#
# Empty = off, same convention as synoptic_token and discord_webhook_url.

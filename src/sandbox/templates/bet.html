{% extends "base.html" %}
{% block title %}Bet{% endblock %}
{% block body %}
<main class="page">
<h1>Place a paper bet</h1>
<p class="muted">Bets go to the manual account (paper). Preview checks the live order book; nothing here places a real order.</p>
<form id="f" onsubmit="return false">
  <label for="ticker">Market</label>
  <select id="ticker" name="ticker">
    {% for m, t in markets %}<option value="{{ m.ticker }}"{% if m.ticker == selected %} selected{% endif %}>{{ t }}</option>{% endfor %}
  </select>
  <label for="side">Side</label><select id="side" name="side"><option>yes</option><option>no</option></select>
  <label for="contracts">Contracts</label><input id="contracts" name="contracts" type="number" min="1" max="100" value="1">
  <label for="price_cap">Max price</label><input id="price_cap" name="price_cap" type="number" step="0.01" min="0.01" max="0.99" value="0.50">
  <div><button class="btn" id="preview">Preview fill</button><button class="btn primary" id="confirm" disabled>Confirm paper bet</button></div>
</form>
<pre id="out" class="muted" aria-live="polite"></pre>
<script>
const f = document.getElementById('f'), out = document.getElementById('out'), confirmBtn = document.getElementById('confirm');
const body = () => ({ticker: f.ticker.value, side: f.side.value,
                     contracts: Number(f.contracts.value), price_cap: Number(f.price_cap.value)});
// A preview is only good for the exact values it priced: any edit needs a new preview.
// `gen` also stops a preview that was in flight during an edit from re-enabling Confirm.
let gen = 0;
const invalidate = () => { gen += 1; confirmBtn.disabled = true; };
f.addEventListener('input', invalidate);
f.addEventListener('change', invalidate);
document.getElementById('preview').onclick = async () => {
  invalidate();
  const mine = gen;
  const q = new URLSearchParams(body());
  const r = await fetch('/api/preview?' + q); const j = await r.json();
  if (mine !== gen) return;
  out.textContent = JSON.stringify(j, null, 2);
  confirmBtn.disabled = !(r.ok && j.contracts > 0);
};
confirmBtn.onclick = async () => {
  if (confirmBtn.disabled) return;
  invalidate();   // at once: a double click must not place two bets
  const r = await fetch('/api/bet', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                     body: JSON.stringify(body())});
  out.textContent = JSON.stringify(await r.json(), null, 2);
};
</script>
</main>
{% endblock %}
